<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CurlSwiggerLabs</title>
    <meta
      name="description"
      content="PortSwigger Web Security Academy labs solved with curl."
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://curlswiggerlabs.echoesofwhoami.com/" />
    <meta http-equiv="refresh" content="0;url=https://curlswiggerlabs.echoesofwhoami.com/" />

    <link rel="icon" type="image/png" href="https://curlswiggerlabs.echoesofwhoami.com/favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />

    <style>
      :root {
        --page-bg: #0b0d13;
        --surface: #0a0f1b;
        --border: #334155;
        --text: #e2e8f0;
        --text-muted: #94a3b8;
        --heading: #f8fafc;
        --accent: #dc2626;
        --accent-hover: #ef4444;
        --radius: 6px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        background: var(--page-bg);
        color: var(--text);
        font-family: Quicksand, "Segoe UI", sans-serif;
        font-size: 18px;
        font-weight: 500;
        line-height: 1.6;
      }

      main {
        width: min(40rem, 100%);
        padding: 2rem 1.75rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
      }

      h1 {
        margin: 0 0 0.75rem;
        color: var(--heading);
        font-size: 2rem;
        font-weight: 700;
        line-height: 1.2;
      }

      p {
        margin: 0 0 1rem;
        color: var(--text-muted);
      }

      p:last-of-type {
        margin-bottom: 1.5rem;
      }

      a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        color: var(--accent-hover);
        text-decoration: underline;
      }

      .cta {
        display: inline-block;
        padding: 0.65rem 1rem;
        border-radius: var(--radius);
        background: var(--accent);
        color: #fff;
      }

      .cta:hover,
      .cta:focus-visible {
        background: var(--accent-hover);
        color: #fff;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CurlSwiggerLabs</h1>
      <p>PortSwigger Web Security Academy labs solved with curl.</p>
      <p>
        This path is not a page. The site lives at
        <a href="https://curlswiggerlabs.echoesofwhoami.com/">curlswiggerlabs.echoesofwhoami.com</a>.
      </p>
      <p>
        <a class="cta" href="https://curlswiggerlabs.echoesofwhoami.com/">Continue to CurlSwiggerLabs</a>
      </p>
    </main>
    <script>
      location.replace("https://curlswiggerlabs.echoesofwhoami.com/");
    </script>
  </body>
</html>
